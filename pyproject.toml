[project]
name = "gpc-rag-chatbot"
version = "0.1.0"
description = "Sistema RAG on-premise para consultar Guias de Practica Clinica (GPC) via chatbot, usando Ollama y Qdrant, sin dependencias de pago."
authors = [
    "Jhonner <jjacostac23@gmail.com>",
]
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "chainlit>=2.12.0",
    "datasets>=3.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "hydra-core>=1.3.6",
    "langchain-core<0.4",
    "langchain-ollama==0.2.3",
    "langgraph<0.3",
    "ollama>=0.6.2",
    "omegaconf>=2.3.1",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "ragas==0.2.15",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "torch>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[project.urls]
documentation = "https://Jhonner23.github.io/gpc-rag-chatbot"
repository = "https://github.com/Jhonner23/gpc-rag-chatbot"


[dependency-groups]
dev = [
    "pre-commit>=4.6.2", # Code linting and formatting
    "pytest>=9.1.1", # Testing framework
    "pytest-cookies>=0.7.0",
    "pytest-cov>=7.1.0",
    "cruft[pyproject]>=2.16.0",# Automated Cookiecutter template synchronization
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.9", # deteccion geometrica de tablas (trees/table_extraction.py, sin LLM)
]

#
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=10.19",
]
#

[tool.uv]
package = false
default-groups = [
    "dev",
#
    "docs",
#
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
