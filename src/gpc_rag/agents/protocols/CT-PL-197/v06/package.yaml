protocol:
  id: CT-PL-197
  name: Protocolo infección del tracto urinario (ITU) y bacteriuria asintomática en
    población adulta
  description: Atención de pacientes adultos con diagnóstico de bacteriuria asintomática
    o infección del tracto urinario
version:
  version: v06
  approval_date: '2025-09-30'
  change_summary: Se cambia nombre a protocolo Infección del Tracto Urinario Adultos.
    Se cambia definición de ITU complicada. Se actualizan recomendaciones de manejo
    según clasificación de ITU y factores de riesgo. Se dan consideraciones del manejo
    de la ITU en la gestante.
variables:
  bacteriuria_significativa:
    id: bacteriuria_significativa
    label: Bacteriuria significativa (recuento significativo de colonias en orina)
    type: BOOLEAN
    description: Criterio de laboratorio de la fuente; no es un umbral fijo de UFC.
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p1_def_ba
      - frag_p1_def_itu
      - frag_p1_def_itu_bajo
      - frag_p1_def_itu_alto
      notes: La fuente usa 'recuento significativo de colonias bacterianas en muestras
        de orina' (definiciones de BA e ITU) y 'bacteriuria significativa' (definiciones
        de ITU bajo y alto) para el mismo criterio de laboratorio; concepto canónico
        normalizado sin umbral universal (los umbrales numéricos de la página 3 son
        específicos por contexto).
  sin_signos_sintomas_itu:
