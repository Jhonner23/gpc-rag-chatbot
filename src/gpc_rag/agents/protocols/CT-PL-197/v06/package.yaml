    expected_results:
      rule_t2_itu_alta_gestante_cefazolina: 'TRUE'
      rule_t2_itu_alta_gestante_piperacilina: 'FALSE'
      rule_t2_itu_alta_gestante_meropenem: 'FALSE'
  tc_t2_alta_piperacilina:
