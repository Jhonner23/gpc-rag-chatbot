rules:
  rule_def_ba:
    id: rule_def_ba
    condition:
      operator: AND
      operands:
      - kind: FLAG
        variable_ref: bacteriuria_significativa
        expected: true
      - kind: FLAG
        variable_ref: sin_signos_sintomas_itu
        expected: true
    action_refs: []
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p1_def_ba
      notes: 'Componente 1 de la definición de BA: bacteriuria significativa sin signos
        ni síntomas atribuibles a ITU; ver rule_def_ba_cultivos y rule_def_ba_piuria_pediatrica.'
    exceptions: []
    validation_status: EXTRACTED
  rule_def_ba_cultivos:
    id: rule_def_ba_cultivos
    condition:
      operator: OR
      operands:
      - operator: AND
        operands:
