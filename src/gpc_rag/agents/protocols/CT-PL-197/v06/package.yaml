          variable_ref: mujer_no_embarazada
          expected: true
        - kind: FLAG
          variable_ref: urocultivos_2_mismo_patron
          expected: true
      - operator: AND
        operands:
        - kind: FLAG
          variable_ref: hombre
          expected: true
        - kind: FLAG
          variable_ref: urocultivo_unico
          expected: true
      - operator: AND
        operands:
        - kind: FLAG
          variable_ref: gestante
          expected: true
        - kind: FLAG
          variable_ref: urocultivo_unico
          expected: true
    action_refs: []
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p1_def_ba_cultivos
      notes: 'Componente 2 de la definición de BA: requisito microbiológico por población
        de la misma oración fuente.'
    exceptions: []
    validation_status: EXTRACTED
  rule_def_ba_piuria_pediatrica:
