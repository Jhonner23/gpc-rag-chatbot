validation_items:
  vi_recuento_significativo_umbral:
    id: vi_recuento_significativo_umbral
    category: gap
    description: DEFINICIONES usa 'recuento significativo de colonias bacterianas'
      / 'bacteriuria significativa' sin umbral numérico; los umbrales de la página
      3 son específicos por contexto y no se codifican como umbral universal de la
      variable bacteriuria_significativa.
    severity: high
    related_ids:
    - bacteriuria_significativa
    - rule_def_ba
    - rule_def_itu
    status: OPEN
  vi_urocultivo_umbrales_ocr:
    id: vi_urocultivo_umbrales_ocr
    category: ambiguity
    description: Los umbrales de positividad del urocultivo contienen artefactos OCR/superíndices
      ('10 5', 'o btenida'); la evidencia verbatim los preserva y la representación
      numérica normalizada está documentada en la procedencia.
    severity: low
    related_ids:
    - frag_p3_urocultivo_positivo_1e5
    status: OPEN
  vi_nota_doble_asterisco:
    id: vi_nota_doble_asterisco
    category: ambiguity
    description: El marcador '**' aparece dos veces en las notas de la Tabla 1 (fila
      de bacteriuria asintomática y definición de FR para BGN resistentes); ambas
      notas se conservan como fragmentos separados.
    severity: low
    related_ids:
    - frag_p4_t1_nota_ba
    - frag_p4_t1_nota_fr
    status: OPEN
  vi_seleccion_antibiotico_alternativas:
    id: vi_seleccion_antibiotico_alternativas
    category: limitation
    description: Las tablas declaran alternativas ('Nitrofurantoína o Cefalexina o
      Fosfomicina') sin lógica de selección; las múltiples acciones PRESCRIBE de una
      regla son alternativas declaradas en la fuente y nunca se ejecutan simultáneamente.
      Fase 7 debe renderizarlas unidas por 'o', nunca como prescripciones simultáneas.
    severity: high
    related_ids:
    - rule_t1_itu_baja
    - rule_t1_ba_row
    - rule_t2_ba_gestante
    status: OPEN
  vi_restricciones_procedimiento:
    id: vi_restricciones_procedimiento
    category: limitation
    description: La instrucción de tomar la muestra antes de la primera dosis de antibiótico
      está adherida a la indicación del urocultivo; los detalles de procedimiento
      (desechar 15-30 ml iniciales, sonda recién insertada) permanecen declarativos.
    severity: low
    related_ids:
    - rule_urocultivo_indicado
    - act_restriccion_muestra_previa
    status: OPEN
  vi_evitar_primer_trimestre_ambiguedad:
    id: vi_evitar_primer_trimestre_ambiguedad
    category: ambiguity
    description: '''Evitar en primer trimestre'' aparece en la columna de observaciones
      de las filas ITU baja y ITU alta de la Tabla 2 sin nombrar el medicamento; la
      capa de texto no permite mapearlo a un fármaco específico, por lo que no se
      codifica como restricción por medicamento.'
    severity: medium
    related_ids:
    - frag_p5_t2_observacion_trimestre
    - frag_p4_t2_itu_baja_row
    status: OPEN
  vi_semana34_calendar:
    id: vi_semana34_calendar
    category: limitation
    description: '''Hasta semana 34 gestación'', el posible cambio a cefalexina o
      nitrofurantoína en la semana 34 ''si el microorganismo es sensible'' y ''administrar
      hasta la finalización del embarazo'' son construcciones de calendario no computables
      por el motor; se transportan en payloads y notas.'
    severity: medium
    related_ids:
    - frag_p5_t2_nota4
    - act_preventiva_nitrofurantoina
    status: OPEN
  vi_historia_clinica_no_computable:
    id: vi_historia_clinica_no_computable
    category: limitation
    description: Hospitalización >48h en los últimos 3 meses, uso de antibióticos
      en los últimos 90 días, recurrencia y número de episodios son entradas clínicas/históricas
      externas; el motor no computa historias ni calendarios.
    severity: medium
    related_ids:
    - hospitalizacion_48h_ultimos_3meses
    - antibioticos_ultimos_90dias
    - mas_de_un_episodio_itu
    - recurrencia_itu
    - itu_recurrente
    status: OPEN
  vi_fiebre_72h_dos_condiciones:
    id: vi_fiebre_72h_dos_condiciones
    category: ambiguity
    description: '''Fiebre persistente después de 72 horas de tratamiento antibiótico
      correcto'' acopla duración de fiebre y adecuación del tratamiento; se representa
      como duración ≥72h AND tratamiento correcto.'
    severity: low
    related_ids:
    - fiebre_horas
    - tratamiento_antibiotico_correcto
    - rule_imagen_urgente
    status: OPEN
  vi_criterio_pediatrico_fuera_alcance:
    id: vi_criterio_pediatrico_fuera_alcance
    category: scope
    description: El bullet 'Pielonefritis aguda en pacientes pediátricos' se conserva
      como evidencia fuente (frag_p3_hosp_pediatrica); no se crea regla ejecutable
      porque el alcance del protocolo excluye neonatos y niños. La composición de
      hospitalización usa las 8 indicaciones aplicables a adultos.
    severity: medium
    related_ids:
    - frag_p3_hosp_pediatrica
    status: OPEN
  vi_prostatitis_fuera_alcance:
    id: vi_prostatitis_fuera_alcance
    category: scope
    description: La fuente incluye prostatitis en la definición de ITU complicada
      y declara que 'excede los alcances del presente protocolo'; se conserva como
      evidencia y en las notas de la regla, sin acción operativa inventada.
    severity: medium
    related_ids:
    - frag_p1_def_itu_complicada_clinica
    - rule_def_itu_complicada_clinica
    status: OPEN
  vi_ajuste_urocultivo_antibiograma:
    id: vi_ajuste_urocultivo_antibiograma
    category: limitation
    description: '''Siempre debe ajustarse según resultados de urocultivo y antibiograma''
      y ''la decisión se toma con base en los cultivos y pruebas de sensibilidad''
      son instrucciones procedimentales no computables; se transportan en la procedencia.'
    severity: low
    related_ids:
    - frag_p5_t2_nota1
    - frag_p5_t2_nota2
    status: OPEN
fragments:
  frag_p1_metadata:
    id: frag_p1_metadata
    document_id: doc-800af94bc0654138
    page: 1
    section: PROTOCOLO
    verbatim_text: PROTOCOLO INFECCION DEL TRACTO URINARIO (ITU) Y BACTERIURIA ASINTOMATICA
      EN POBLACION ADULTA
  frag_p1_codigo_version:
    id: frag_p1_codigo_version
    document_id: doc-800af94bc0654138
    page: 1
    section: PROTOCOLO
    verbatim_text: 'Proceso: Cuidado y tratamiento Código: CT-PL-197 Versión: 06 Fecha
      aprobación: 30-sep-2025'
  frag_p1_alcance:
    id: frag_p1_alcance
    document_id: doc-800af94bc0654138
    page: 1
    verbatim_text: '2. ALCANCE: Esta guía aplica para todo el personal médico que
      interviene en la atención de pacientes adultos, excluyendo neonatos y niños
      con diagnóstico de bacteriuria asintomática o ITU.'
  frag_p1_def_ba:
    id: frag_p1_def_ba
    document_id: doc-800af94bc0654138
    page: 1
    section: 3. DEFINICIONES
    verbatim_text: 'Bacteriuria asintomática: Recuento significativo de colonias bacterianas
      en muestras de orina, colectadas apropiadamente, provenientes de pacientes sin
      signos o síntomas atribuibles a ITU.'
  frag_p1_def_ba_cultivos:
    id: frag_p1_def_ba_cultivos
    document_id: doc-800af94bc0654138
    page: 1
    section: 3. DEFINICIONES
    verbatim_text: Se requiere 2 urocultivos con el mismo patógeno y perfil de sensibilidad
      en mujeres no embarazadas, 1 en hombres y pacientes gestantes.
  frag_p1_def_ba_piuria:
    id: frag_p1_def_ba_piuria
    document_id: doc-800af94bc0654138
    page: 1
    section: 3. DEFINICIONES
    verbatim_text: En población pediátrica debe haber ausencia de piuria en el sedimento.
  frag_p1_def_itu:
    id: frag_p1_def_itu
    document_id: doc-800af94bc0654138
    page: 1
    section: 3. DEFINICIONES
    verbatim_text: 'Infección del tracto urinario: Recuento significativo de colonias
      bacterianas en muestras de orina, colectadas apropiadamente, en pacientes con
      signos o síntomas atribuibles a ITU'
  frag_p1_def_itu_complicada_estructural:
    id: frag_p1_def_itu_complicada_estructural
    document_id: doc-800af94bc0654138
    page: 1
    section: 3. DEFINICIONES
    verbatim_text: 'Infección del tracto urinario complicada: ITU que ocurre en presencia
      de alterac iones estructurales o funcionales de las vías urinarias'
  frag_p1_def_itu_bajo:
    id: frag_p1_def_itu_bajo
    document_id: doc-800af94bc0654138
    page: 1
    section: 3. DEFINICIONES
    verbatim_text: 'Infección del tracto urinario bajo (cistitis y uretritis): Infección
      aguda de la vejiga y/o la uretra, acompañada por bacteriuria significativa,
      en ausencia de leucorrea, irritación vaginal, fiebre, d olor lumbar y compromiso
      sistémicos'
  frag_p1_def_itu_alto:
    id: frag_p1_def_itu_alto
    document_id: doc-800af94bc0654138
    page: 1
    section: 3. DEFINICIONES
    verbatim_text: 'Infección del tracto urinario alto (pielonefritis): Infección
      aguda del riñón acompañada por bacteriuria significativa.'
  frag_p1_def_itu_complicada_clinica:
    id: frag_p1_def_itu_complicada_clinica
    document_id: doc-800af94bc0654138
    page: 1
    section: 3. DEFINICIONES
    verbatim_text: 'ITU complicada: infección en mujeres u hombres, con compromiso
      más allá de la vejiga, incluyendo pielonefritis, ITU febril o bacteriémica,
      ITU asociada a catéter y prostatitis (este último tema excede los alcances del
      presente protocolo).'
  frag_p2_clasificacion_alta_baja:
    id: frag_p2_clasificacion_alta_baja
    document_id: doc-800af94bc0654138
    page: 2
    verbatim_text: La presentación clínica de la ITU permite clasificar la infección
      como alta o baja, clasificación necesaria para definir el tratamiento y el pronóstico.
  frag_p2_no_sintomas_itu:
    id: frag_p2_no_sintomas_itu
    document_id: doc-800af94bc0654138
    page: 2
    verbatim_text: No se consideran síntomas compatibles con ITU la orina turb ia
      o de mal olor.
  frag_p2_embarazada_debe_tratarse:
    id: frag_p2_embarazada_debe_tratarse
    document_id: doc-800af94bc0654138
    page: 2
    verbatim_text: En mujeres embarazadas, la bacteriuria asintomática debe tratarse
      porque se ha asociado con un mayor riesgo de pielonefritis
  frag_p2_citoquimico:
    id: frag_p2_citoquimico
    document_id: doc-800af94bc0654138
    page: 2
    section: 5. Diagnóstico
    verbatim_text: Se debe realizar citoquímico de orina a todo paciente en el servicio
      de urgencias con sospecha de ITU, excepto mujeres con primer episodio y síntomas
      típicos.
  frag_p2_tirilla_descarta:
    id: frag_p2_tirilla_descarta
    document_id: doc-800af94bc0654138
    page: 2
    section: 5. Diagnóstico
    verbatim_text: La tirilla de orina es una herramienta de tamizaje para el diagnóstico,
      un resultado normal en pacientes con baja sospecha clínica descarta el diagnóstico.
  frag_p2_piuria:
    id: frag_p2_piuria
    document_id: doc-800af94bc0654138
    page: 2
    section: 5. Diagnóstico
    verbatim_text: Hay una alta correlación entre la presencia de piuria (>10 leucocitos)
      e infección, su ausencia puede sugerir colonización
  frag_p3_gram:
    id: frag_p3_gram
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: 'Gram de orina sin centrifugar: Suministra información inmediata
      sobre la naturaleza de la infección y sirve para guiar el tratamiento empírico,
      por lo que debe realizarse en todos los pacientes en el servicio de urgencias.'
  frag_p3_urocultivo_indicacion:
    id: frag_p3_urocultivo_indicacion
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: Debe solicitarse en todos los casos, excepto primer episodio de
      ITU baja no complicada en mujer premenopáusica.
  frag_p3_urocultivo_positivo_1e5:
    id: frag_p3_urocultivo_positivo_1e5
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: Los urocultivos se consideran positivos con el crecimiento de ≥10
      5 UFC de una bacteria en una muestra de orina o btenida de forma adecuada por
      micción espontánea
  frag_p3_urocultivo_positivo_1e3:
    id: frag_p3_urocultivo_positivo_1e3
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: con un crecimiento ≥10 3 UFC en un paciente con síntomas no explicados
      por otra patología
  frag_p3_urocultivo_positivo_1e2:
    id: frag_p3_urocultivo_positivo_1e2
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: el crecimiento de ≥10 2 UFC de una bacteria en una muestra de orina
      obtenida a través de una sonda vesical recién insertada.
  frag_p3_toma_muestra_antibiotico:
    id: frag_p3_toma_muestra_antibiotico
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: 'Toma de la muestra: debe tomarse antes de la primera dosis de
      antibiótico'
  frag_p3_analisis_sangre:
    id: frag_p3_analisis_sangre
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: En todo paciente con ITU que sea hospitalizado debe obtenerse muestra
      de sangre para hemoleucograma, ionograma, función renal y proteína C reactiva
      (PCR).
  frag_p3_hemocultivos:
    id: frag_p3_hemocultivos
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: Los hemocultivos deben solicitarse en todos los casos de pielonefritis
      aguda que cursan con fiebre, hipotermia o ch oque séptico.
  frag_p3_imagen_urgente:
    id: frag_p3_imagen_urgente
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: La realización urgente de ecografía o la tomografía (TC) con contraste
      está indicada en pacientes con infección urinaria y choque séptico asociado,
      falla renal aguda, clínica de complicación local o fiebre persistente después
      de 72 horas de tratamiento antibiótico correcto.
  frag_p3_imagen_tc_abscesos:
    id: frag_p3_imagen_tc_abscesos
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: Se hará TC con contraste cuando se busquen pequeños abscesos y
      áreas de nefritis local, por la mayor sensibilidad del estudio.
  frag_p3_imagen_urotomografia:
    id: frag_p3_imagen_urotomografia
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: en los casos de sospecha de alteración estructural, incluyendo
      la litiasis de vías urinarias la elección será urotomografía
  frag_p3_imagen_ecografia:
    id: frag_p3_imagen_ecografia
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: para los casos en los cuales se sospecha una alteración funcional,
      especialmente por inadecuado vaciamiento vesical o trastornos obstructivos de
      las vías urinarias, la elección será ecografía de vías urinarias con medición
      del residuo postmiccional.
  frag_p3_imagen_gestante:
    id: frag_p3_imagen_gestante
    document_id: doc-800af94bc0654138
    page: 3
    section: 5. Diagnóstico
    verbatim_text: En las mujeres embarazadas se hará ecografía renal en todas las
      pacientes con pielonefritis, más de un episodio de ITU durante el embarazo,
      sospecha de litiasis por hematuria y/o dolor.
  frag_p3_tto_ba_indicaciones:
    id: frag_p3_tto_ba_indicaciones
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Indicaciones de tratamiento de bacteriuria asintomática
  frag_p3_tto_ba_gestante:
    id: frag_p3_tto_ba_gestante
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Mujer embarazada
  frag_p3_tto_ba_procedimiento:
    id: frag_p3_tto_ba_procedimiento
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Procedimiento invasivo de vías urinarias con riesgo de sangrado
      o disrupción del uroepitelio
  frag_p3_hosp_choque_septico:
    id: frag_p3_hosp_choque_septico
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Choque séptico
  frag_p3_hosp_intolerancia:
    id: frag_p3_hosp_intolerancia
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Intolerancia a la vía oral
  frag_p3_hosp_itu_alta:
    id: frag_p3_hosp_itu_alta
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: ITU alta
  frag_p3_hosp_descompensacion:
    id: frag_p3_hosp_descompensacion
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Descompensación de la enfermedad de base secundaria a la ITU
  frag_p3_hosp_resistente:
    id: frag_p3_hosp_resistente
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Demostración de germen resistente sin opción de tratamiento antibiótico    ambulatorio
  frag_p3_hosp_funcion_renal:
    id: frag_p3_hosp_funcion_renal
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Deterioro de la función renal asociado a la ITU
  frag_p3_hosp_absceso:
    id: frag_p3_hosp_absceso
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Absceso renal/pararrenal.
  frag_p3_hosp_pediatrica:
    id: frag_p3_hosp_pediatrica
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Pielonefritis aguda en pacientes pediátricos.
  frag_p3_hosp_social:
    id: frag_p3_hosp_social
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: Inadecuado soporte social para continuidad de terapia ambulatoria
  frag_p3_egreso_afebril:
    id: frag_p3_egreso_afebril
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: 48 horas afebril
  frag_p3_egreso_tas:
    id: frag_p3_egreso_tas
    document_id: doc-800af94bc0654138
    page: 3
    section: 6. TRATAMIENTO
    verbatim_text: TAS > 90 mmHg
  frag_p4_egreso_fc:
    id: frag_p4_egreso_fc
    document_id: doc-800af94bc0654138
    page: 4
    section: 6. TRATAMIENTO
    verbatim_text: FC < 100 lpm
  frag_p4_egreso_fr:
    id: frag_p4_egreso_fr
    document_id: doc-800af94bc0654138
    page: 4
    section: 6. TRATAMIENTO
    verbatim_text: FR < 24 rpm
  frag_p4_egreso_sato2_pao2:
    id: frag_p4_egreso_sato2_pao2
    document_id: doc-800af94bc0654138
    page: 4
    section: 6. TRATAMIENTO
