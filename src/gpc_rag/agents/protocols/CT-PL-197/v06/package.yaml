  tc_t2_itu_baja_no_gestante:
    id: tc_t2_itu_baja_no_gestante
    inputs:
      gestante: false
      itu_baja: true
    expected_results:
      rule_t2_itu_baja_gestante: 'FALSE'
  tc_t2_alta_cefazolina:
