agent_policy:
  purpose: Consulta estructurada del árbol clínico, no constituye orden médica ni prescripción automática.
  default_behavior: abstain_on_unresolved_or_unmatched_case
  must_not_infer:
  - rutas no descritas en el diagrama
  - pautas de ajuste por alergia, función renal o interacciones farmacológicas
  - indicaciones clínicas no aprobadas expresamente por personal médico
  - clasificación como ITU alta o baja cuando el paciente no cumple criterios de clasificación
  - criterios de hospitalización o manejo ambulatorio distintos de las rutas clínicas descritas en el árbol
  - opciones farmacológicas en embarazo sin revisión de sensibilidad, edad gestacional y contraindicaciones
  - prescribir sin haber clasificado clínicamente los síntomas urinarios
  safety:
    require_citations_to_protocol: true
    require_human_review_for_unresolved_nodes: true
    allow_rule_execution_before_approval: false
