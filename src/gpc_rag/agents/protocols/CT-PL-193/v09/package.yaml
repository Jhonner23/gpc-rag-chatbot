rules:
  rule_definicion_nac:
    id: rule_definicion_nac
    condition:
      operator: AND
      operands:
      - kind: FLAG
        variable_ref: sintomas_respiratorios_generales
        expected: true
      - kind: FLAG
        variable_ref: alteracion_radiologica
        expected: true
      - kind: FLAG
        variable_ref: sin_otras_causas_evidentes
        expected: true
      - operator: OR
        operands:
        - operator: NOT
          operands:
          - kind: FLAG
            variable_ref: hospitalizado
            expected: true
        - kind: FLAG
          variable_ref: sintomas_dentro_48h_ingreso
          expected: true
    action_refs: []
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p1_definicion_nac
      notes: Definición operativa de NAC ensamblada desde la frase de DEFINICIONES.
    exceptions: []
    validation_status: EXTRACTED
  rule_diagnostico_radiografico:
    id: rule_diagnostico_radiografico
    condition:
      operator: AND
      operands:
      - kind: FLAG
        variable_ref: cuadro_clinico_compatible
        expected: true
      - kind: FLAG
        variable_ref: infiltrado_reciente_rx
        expected: true
    action_refs: []
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p3_rx_torax
      notes: 'Criterio diagnóstico ensamblado: cuadro clínico compatible + infiltrado
        de reciente aparición.'
    exceptions: []
    validation_status: EXTRACTED
  rule_rx_torax_indicada:
    id: rule_rx_torax_indicada
    condition:
      kind: FLAG
      variable_ref: signos_sintomas_respiratorios_bajos
      expected: true
    action_refs:
    - act_rx_torax
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p3_rx_torax
      notes: Indicación de radiografía en pacientes con signos y síntomas respiratorios
        bajos.
    exceptions: []
    validation_status: EXTRACTED
  rule_rx_repetir_48h:
    id: rule_rx_repetir_48h
    condition:
      operator: AND
      operands:
      - kind: FLAG
        variable_ref: rx_inicial_sin_hallazgos
        expected: true
      - kind: FLAG
        variable_ref: sospecha_alta_neumonia
        expected: true
    action_refs:
    - act_rx_torax_repetida_48h
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p3_rx_repetir
      notes: Repetir radiografía en 48 horas; el intervalo es dato declarativo.
    exceptions: []
    validation_status: EXTRACTED
  rule_tc_torax:
    id: rule_tc_torax
    condition:
      operator: AND
      operands:
      - kind: FLAG
        variable_ref: alta_probabilidad_neumonia
        expected: true
      - kind: FLAG
        variable_ref: rx_no_concluyente
        expected: true
      - operator: OR
        operands:
        - kind: FLAG
          variable_ref: prioritario_diagnostico
          expected: true
        - kind: FLAG
          variable_ref: sospecha_complicacion
          expected: true
    action_refs:
    - act_tc_torax
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p3_tc
      notes: Indicación de tomografía ensamblada desde 'Sólo está indicada en...'.
    exceptions: []
    validation_status: EXTRACTED
  rule_tc_neutropenia_febril:
    id: rule_tc_neutropenia_febril
    condition:
      operator: AND
      operands:
      - kind: FLAG
        variable_ref: neutropenia_febril
        expected: true
      - kind: FLAG
        variable_ref: signos_sintomas_respiratorios_bajos
        expected: true
    action_refs:
    - act_tc_torax
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p3_tc_neutropenia
      notes: Tomografía simple en neutropenia febril.
    exceptions: []
    validation_status: EXTRACTED
  rule_labs_sospecha:
    id: rule_labs_sospecha
    condition:
      kind: FLAG
      variable_ref: sospecha_neumonia
      expected: true
    action_refs:
    - act_hemoleucograma
    - act_bun
    provenance:
      derivation: NORMALIZED
      fragment_refs:
      - frag_p3_labs_sospecha
      notes: Laboratorios basales ante sospecha.
    exceptions: []
    validation_status: EXTRACTED
  rule_labs_hospitalizacion:
