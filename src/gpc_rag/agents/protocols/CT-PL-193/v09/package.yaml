validation_items:
  vi_tratamiento_empirico_gap:
    id: vi_tratamiento_empirico_gap
    category: gap
    description: La página 4 termina en el encabezado 'TRATAMIENTO ANTIBIÓTICO EMPÍRICO:'
      sin contenido y sin imágenes en las páginas 4 y 5; el control de cambios de
      la versión 9 menciona 'tratamiento empírico según factores de riesgo'. El contenido
      no está disponible en la capa de texto extraída y no se reconstruye.
    severity: high
    related_ids:
    - frag_p4_tratamiento_heading
    - frag_p7_control_cambios_v09
    status: OPEN
  vi_algoritmos_imagen:
    id: vi_algoritmos_imagen
    category: gap
    description: La página 6 contiene el encabezado 'ALGORITMOS DE DIAGNÓSTICO Y MANEJO:'
      seguido de una imagen embebida no extraíble como texto; los algoritmos no se
      representan ni se reconstruyen.
    severity: high
    related_ids:
    - frag_p6_algoritmos
    status: OPEN
  vi_curb65_componentes:
    id: vi_curb65_componentes
    category: unresolved
    description: La fuente referencia 'Escala de severidad CURB-65 ≥2' sin definir
      los componentes ni el cálculo de la escala; curb65_score se modela como dato
      externo no computable desde la fuente.
    severity: high
    related_ids:
    - curb65_score
    - rule_hosp_criterio_curb65
    status: OPEN
  vi_filmarray_seleccion_panel:
    id: vi_filmarray_seleccion_panel
    category: limitation
    description: Las indicaciones de panel (502828 sin sospecha SARSCOV2; 502162 en
      quienes no expectoran) pueden satisfacerse simultáneamente; el modelo canónico
      no tiene semántica de selección/exclusividad y la fuente no provee lógica explícita
      para resolverlo. Las reglas de panel son declarativas y sin acciones.
    severity: medium
    related_ids:
    - rule_filmarray_panel_profundo
    - rule_filmarray_panel_hisopado
    status: OPEN
  vi_definicion_nac_operacionalizacion:
    id: vi_definicion_nac_operacionalizacion
    category: ambiguity
    description: Componentes de la definición de NAC ('sin otras causas evidentes',
      'síntomas respiratorios y/o generales') son juicios clínicos que la fuente no
      operacionaliza; se representan como banderas booleanas directas.
    severity: low
    related_ids:
    - rule_definicion_nac
    - sin_otras_causas_evidentes
    status: OPEN
  vi_uci_bullet1_parsing:
    id: vi_uci_bullet1_parsing
    category: ambiguity
    description: El agrupamiento por comas del primer criterio de UCI-UCE se interpretó
      como OR de cinco alternativas; la interpretación está documentada en la procedencia
      de rule_uci_bullet1.
    severity: low
    related_ids:
    - rule_uci_bullet1
    status: OPEN
  vi_temporal_no_representable:
    id: vi_temporal_no_representable
    category: limitation
    description: El intervalo 'repetir radiografía en 48 horas', la 'cita de revisión
      a las 4 semanas' y el vínculo 'al momento del alta' son programaciones futuras
      que la semántica temporal mínima (duraciones numéricas) no representa; se transportan
      como datos declarativos en payloads y notas.
    severity: low
    related_ids:
    - rule_rx_repetir_48h
    - rule_plan_egreso
    status: OPEN
  vi_unidades_no_declaradas:
    id: vi_unidades_no_declaradas
    category: ambiguity
    description: La fuente no declara unidades para lactato sérico, plaquetas, leucocitos,
      PO2 y PaO2/FiO2; las unidades se dejan ausentes en el modelo.
    severity: low
    related_ids:
    - lactato_serico
    - plaquetas
    - leucocitos
    - po2
    - pao2_fio2
    status: OPEN
fragments:
  frag_p1_metadata:
    id: frag_p1_metadata
    document_id: doc-3a1654757801b7b6
    page: 1
    section: PROTOCOLO
    verbatim_text: 'PROTOCOLO DE PRÁCTICA CLÍNICA DE NEUMONÍA ADQUIRIDA EN COMUNIDAD
      Proceso: Cuidado y tratamiento Código: CT-PL-193 Versión: 9 Fecha aprobación:
      12-ago-2024'
  frag_p1_definicion_nac:
    id: frag_p1_definicion_nac
    document_id: doc-3a1654757801b7b6
    page: 1
    section: PROTOCOLO
    verbatim_text: La neumonía adquirida en comunidad (NAC) es aquella que se presenta
      en aparicion de sintomas respiratorios y/o sintomas generales, asociados a alteración
      en un estudio radiológico del pulmón sin otras causas evidentes, en pacientes
      no hospitalizados o aquellos hospitalizados en quienes los sintomas o signos
      de infeccion se presentan dentro de las primeras 48 horas de su ingreso hospitalario
  frag_p3_rx_torax:
    id: frag_p3_rx_torax
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: 'El diagnóstico de neumonía se basa en un cuadro clínico compatible
      asociado a un infiltrado pulmonar de reciente aparición en la radiografía de
      tórax que muestre al menos uno de los siguientes hallazgos: Infiltrados alveolares
      o intersticiales segmentarios o infiltrados en uno o más lóbulos y que no estaban
      presentes previamente. La radiografía de tórax se hará en los pacientes con
      signos y síntomas respiratorios bajos (tos, expec toración, dolor pleurítico,
      taquipnea, disnea, desaturación y/o alteraciones auscultatorias compatibles).'
  frag_p3_rx_repetir:
    id: frag_p3_rx_repetir
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: En el caso que la radiografía inicial no muestre hallazgos pero
      exista una sospecha alta de neumonía debe repetirse la radiografía de tórax
      en 48 horas.
  frag_p3_tc:
    id: frag_p3_tc
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: 'Tomografía de tórax (IIA): Sólo está indicada en pacientes con
      alta pro babilidad de neumonía por clínica, con radiografía de tórax no concluyente
      y en quien es prioritario hacer el diagnóstico de neumonía o se sospeche alguna
      complicación (neumonía necro sante, absceso pulmonar o empiema tabicado).'
  frag_p3_tc_neutropenia:
    id: frag_p3_tc_neutropenia
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: En los casos de neutropenia febril se solicitará tomografía de
      tórax simple en todos los pacientes con sintomas respiratorios bajos.
  frag_p3_labs_sospecha:
    id: frag_p3_labs_sospecha
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: Para definir la necesidad de hospitalización, se hará hemoleucograma
      y nitrógeno ureico en todo paciente con so specha de neumonía.
  frag_p3_labs_hospitalizacion:
    id: frag_p3_labs_hospitalizacion
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: 'En pacientes con indicación de hospitalización se adicionarán:
      proteína C reactiva, creatinina, lactato y sodio.'
  frag_p3_labs_shock:
    id: frag_p3_labs_shock
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: En pacientes con choque séptico, sepsis grave o falla orgánica
      múltiple se realizarán además pruebas de coagulación, AST, A LT, bilirrubinas
      y gases arteriales.
  frag_p3_labs_gases_desaturacion:
    id: frag_p3_labs_gases_desaturacion
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: También se solicitarán gases arteriales en pacientes con desaturación.
  frag_p3_labs_derrame:
    id: frag_p3_labs_derrame
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: En pacientes con derrame pleural e indicación de toracentesis se
      solicitarán además deshidrogenasa láctica y proteínas totales en suero para
      la adecuada interpretación de los hallazgos en el líquido pleural
  frag_p3_hemocultivos:
    id: frag_p3_hemocultivos
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: 'Deben tomarse en los pacientes hospitalizados por neumonía que
      presenten una de las siguientes condiciones, nitrógeno ureico en sangre (BUN)
      mayor a 30 mg/dL, Proteína C Reactiva (PCR) mayor a 15 mg/dL o Leucocitosis
      mayor a 15000; o en los pacientes que presenten dos de las siguientes condiciones
      : Presión Arterial Diastólica menor a 60 mmHg, Frecuencia Cardiaca mayor a 120
      lpm, Frecuencia Respiratoria mayor a 30 rpm o Dolor Pleu rítico.'
  frag_p3_esputo_gram:
    id: frag_p3_esputo_gram
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: Deben obtenerse muestras de esputo para tinción y cultivo en todo
      paciente con diagnóstico de neumonía e indicación de hospitalización.
  frag_p3_esputo_inducido:
    id: frag_p3_esputo_inducido
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: Se tomará la muestra por esputo inducido por nebulización de 15-20
      minutos con solución salina hipertónica (3%) en pacientes que no pueden recoger
      la muestra de forma espontánea.
  frag_p3_esputo_calidad:
    id: frag_p3_esputo_calidad
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: Se define una muestra de esputo de buena calidad cuando tiene <
      de 10 células epiteliales y más de 25 leucocitos por campo.
  frag_p3_filmarray:
    id: frag_p3_filmarray
    document_id: doc-3a1654757801b7b6
    page: 3
    section: 1. RECOMENDACIONES PARA EL DIAGNÓSTICO
    verbatim_text: 'Filmarray: Prueba de ácidos nucleicos diseñada para la detección
      rápida y simultánea de virus y bacterias respiratorias, el cual se debe solicitar
      en todo paciente adulto con diagnóstico confirmado de neumonía e indicación
      de hospitalización.'
  frag_p4_panel_profundo:
    id: frag_p4_panel_profundo
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: 'Diagnóstico molecular para panel de neumonía filmarray (cod 502828):
      como primera opción. Muestra tomada de esputo, aspirado traqueal o lavado broncoalveolar
      en pacientes sin sospecha de neumonia por SARSCOV2.'
  frag_p4_panel_hisopado:
    id: frag_p4_panel_hisopado
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: 'Diagnóstico molecular para patógenos respiratorios (cod 502162):
      muestra tomada de hisopado nasofaríngeo en pacientes que no espectoran.'
  frag_p4_liquido_pleural:
    id: frag_p4_liquido_pleural
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Todo paciente con derrame pleural de presunto origen paraneumónico
      (derrame pleural unilateral de más de 1 centímetro de espesor sin una causa
      aparente), debe ser llevado a toracentesis diagnóstica.
  frag_p4_hosp_01:
    id: frag_p4_hosp_01
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Paciente con descompensación de enfermedad de base
  frag_p4_hosp_02:
    id: frag_p4_hosp_02
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Pacientes inmunosuprimidos
  frag_p4_hosp_03:
    id: frag_p4_hosp_03
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Sospecha de gérmenes resistentes
  frag_p4_hosp_04:
    id: frag_p4_hosp_04
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Intolerancia a la vía oral
  frag_p4_hosp_05:
    id: frag_p4_hosp_05
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Sepsis o choque de origen pulmonar
  frag_p4_hosp_06:
    id: frag_p4_hosp_06
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Compromiso multilobar o derrame pleural en los rayos X de tórax
  frag_p4_hosp_07:
    id: frag_p4_hosp_07
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Escala de severidad CURB-65 ≥2
  frag_p4_hosp_08:
    id: frag_p4_hosp_08
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Factores sociales que afecten el cumplimiento y seguimiento del
      tratamiento
  frag_p4_hosp_09:
    id: frag_p4_hosp_09
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Requerimiento de oxigeno suplementario
  frag_p4_uci_bullet1:
    id: frag_p4_uci_bullet1
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: Insuficiencia respiratoria, choque séptico o lactato sérico mayor
      de 2, falla renal aguda que requiere terapia de reemplazo renal o falla orgánica
      multisistémica.
  frag_p4_uci_3de:
    id: frag_p4_uci_3de
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: 'Paciente que cumpla con 3 o más criterios de: - BUN > 30 - FR
      > 30 - Hipotensión que requiera LEV agresivos - Infiltrados multilobares - PaO2/FiO2
      menores de 250 - Confusión - Hipotermia - Plaquetas menor de 100.000 - Leucocitos
      menor de 4000'
  frag_p4_tratamiento_heading:
    id: frag_p4_tratamiento_heading
    document_id: doc-3a1654757801b7b6
    page: 4
    section: 2. RECOMENDACIONES PARA EL MANEJO
    verbatim_text: 'TRATAMIENTO ANTIBIÓTICO EMPÍRICO:'
  frag_p5_plan_egreso:
    id: frag_p5_plan_egreso
    document_id: doc-3a1654757801b7b6
    page: 5
    verbatim_text: Se dará de alta el paciente cuando lleve 48 horas afebril, estable
      en su condicion hemodinamica (Presion arterial sistolica > 90mmHg, frecuencia
      cardiaca <100, frecuencia respiratoria <24, saturación de oxígeno mayor de 90,
      PO2 mayor de 60), tolere la vía oral, las comorbilidades estén compensadas,
      se asegure la administración de tratamiento antibiótico ambulatorio y las condiciones
      sociales lo permitan.
  frag_p6_alta_instrucciones:
    id: frag_p6_alta_instrucciones
