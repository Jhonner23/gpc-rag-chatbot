      derivation: NORMALIZED
      fragment_refs:
      - frag_p3_rx_torax
      notes: 'Colapsa la lista ''al menos uno de los siguientes hallazgos: infiltrados
        alveolares o intersticiales segmentarios o infiltrados en uno o más lóbulos
        no presentes previamente'' en una única variable booleana.'
