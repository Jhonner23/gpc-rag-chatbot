protocol:
  id: CT-PL-193
  name: Protocolo de práctica clínica de neumonía adquirida en comunidad
  description: Atención de pacientes adultos con diagnóstico de neumonía adquirida
    en comunidad
version:
  version: v09
  approval_date: '2024-08-12'
  change_summary: Actualización del protocolo institucional para manejo de neumonía
    adquirida en comunidad en pacientes adultos, indicaciones de pruebas moleculares,
    tratamiento empírico según factores de riesgo y algoritmo de diagnóstico y tratamiento
variables:
  hospitalizado:
    id: hospitalizado
    label: Hospitalizado
    type: BOOLEAN
    description: Paciente hospitalizado al momento de la evaluación.
    provenance:
      derivation: SOURCE_STATED
      fragment_refs:
      - frag_p1_definicion_nac
  sintomas_dentro_48h_ingreso:
    id: sintomas_dentro_48h_ingreso
