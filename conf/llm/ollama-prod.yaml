# Variante para un servidor con mas VRAM (>=12GB). Activar con: llm=ollama-prod
provider: ollama
model: "qwen2.5:7b-instruct"
# Temperatura 0 y semilla fija: la misma pregunta con el mismo contexto da
# la misma respuesta, para que las pruebas y la evaluacion sean reproducibles.
temperature: 0.0
seed: 42
max_tokens: 1200
