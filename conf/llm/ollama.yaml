# Modelo por defecto: pensado para equipos con poca VRAM (<=4GB) o solo CPU.
# En un servidor con mas GPU, sube a "qwen2.5:3b-instruct" o "llama3.1:8b-instruct"
# sin tocar codigo -- solo cambia este archivo (o crea conf/llm/ollama-prod.yaml y
# selecciona con `llm=ollama-prod` al arrancar).
provider: ollama
model: "qwen2.5:3b-instruct"
# Temperatura 0 y semilla fija: la misma pregunta con el mismo contexto da
# la misma respuesta, para que las pruebas y la evaluacion sean reproducibles.
temperature: 0.0
seed: 42
max_tokens: 1200
# Ventana de contexto explicita: con el valor por defecto de Ollama el prompt
# del RAG se recortaba en silencio (ver common/llm_options.py).
num_ctx: 8192
