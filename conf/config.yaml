# Configuracion principal (Hydra). Compone los grupos de abajo.
# Cambiar de ambiente: RAG_ENV=docker (ver src/gpc_rag/common/settings.py)
defaults:
  - env: dev
  - llm: ollama-prod  # qwen2.5:7b, el mismo modelo de los agentes (ver conf/llm/)
  - embeddings_cfg: ollama
  - vectorstore_cfg: qdrant
  - chunking: default
  - _self_

# Parametros de retrieval (no dependen del proveedor)
retrieval:
  top_k_dense: 12          # candidatos recuperados por busqueda densa
  top_k_bm25: 12             # candidatos recuperados por BM25
  top_k_final: 8           # despues de rerank, cuantos chunks van al prompt (con 6, la fila de tratamiento de bacteriuria asintomatica de la Tabla 1 quedaba 7a)
  institutional_quota: 3       # lugares reservados (de top_k_final) para los protocolos de la CUB, si son relevantes
  institutional_min_score: 0.05 # puntaje minimo del reranker para ocupar un lugar reservado
  min_final_score: 0.05     # puntaje minimo (ya penalizado) para entrar al contexto
  use_reranker: true
  reranker_model: "BAAI/bge-reranker-v2-m3"
  exclude_admin_sections: true # Objetivo, Alcance, Resumen, Necesidades de investigacion... no entran si la pregunta no las nombra
  # Temas del corpus. Si la pregunta usa una palabra que no esta en ningun
  # documento y no nombra ninguno de estos temas, el RAG se abstiene.
  topic_terms: [neumonia, neumonias, nac, pneumonia, itu, uti, urinaria, urinario,
    urinarias, urinarios, bacteriuria, pielonefritis, cistitis, prostatitis, urosepsis]
  admin_section_penalty: 0.3 # resta a Objetivo, Alcance, Introduccion... si la pregunta no las nombra (ver retrieval/hybrid.py)
  section_boost: 0.0         # impulso a secciones "N. ..." (ver retrieval/hybrid.py); desactivado
  reranker_max_length: 1024  # tokens por par (pregunta + fragmento) en el reranker

# Respuesta del RAG (ver src/gpc_rag/generation/):
# - extractivo: el modelo elige oraciones textuales de las fuentes, que se
#   muestran con su cita (las de ingles, traducidas). No redacta texto nuevo.
# - generativo: el modelo redacta la respuesta, una pasada por tipo de fuente.
rag:
  mode: extractivo
  max_units: 6              # maximo de oraciones en la respuesta
  min_relevance: 0.1        # si ningun fragmento supera este puntaje del reranker, abstencion

app:
  name: "GPC RAG Chatbot"
  collection_name: "gpc_guidelines"

# Capa de agentes (coordinador, RAG, evaluador -- ver src/gpc_rag/agents/).
# Usa un modelo mas grande que el de generacion (qwen2.5:3b) para las tareas
# de juicio/clasificacion (filtrar preguntas, auditar respuestas): son
# llamadas puntuales (2 por pregunta, no 40+ como en la evaluacion RAGAS), asi
# que el costo extra de latencia se paga menos veces y vale la pena la mejor
# confiabilidad de razonamiento de un modelo mas grande.
agents:
  coordinator_model: "qwen2.5:7b-instruct"
  evaluator_model: "qwen2.5:7b-instruct"
  # Tiempos maximos de espera (ver src/gpc_rag/agents/timeouts.py): por
  # llamada al modelo y por la rama completa del RAG. Con margen sobre lo
  # medido en el equipo de desarrollo (recuperacion: mediana ~55 s, max ~80 s).
  llm_timeout_s: 120
  rag_timeout_s: 240
